<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art & Design | Portfolio</title>
    
    <!-- Tarayıcı sekmesinde (tab) görünecek minik ikon -->
    <link rel="icon" type="image/x-icon" href="icon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-8">
    <div class="max-w-6xl mx-auto">
        
        <!-- ÜST BAŞLIK VE LOGO ALANI (Yan Yana Tasarım) -->
        <header class="mb-10 flex items-center justify-center md:justify-start gap-5 bg-white p-6 rounded-xl shadow-sm">
            <!-- Sayfadaki Logo -->
            <img src="yagmur_logo_2.jpg" alt="Art & Design Logo" class="w-20 h-20 object-cover rounded-full shadow-md hover:scale-105 transition-transform duration-300">
            
            <!-- Başlık ve Alt Başlık (Logonun sağında yer alır) -->
            <div>
                <h1 class="text-4xl font-bold text-gray-800 mb-1">Art & Design</h1>
                <p class="text-gray-500 font-medium">Digital Art Portfolio</p>
            </div>
        </header>

        <!-- Kategori Filtre Butonları -->
        <div id="filters" class="flex flex-wrap justify-center gap-3 mb-10"></div>

        <!-- Resim Galerisi -->
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </div>

    <!-- Tıklayınca Açılan Tam Ekran Resim Alanı (Lightbox) -->
    <div id="lightbox" class="fixed inset-0 bg-black bg-opacity-90 hidden flex justify-center items-center z-50">
        <span id="close-lightbox" class="absolute top-5 right-10 text-white text-5xl cursor-pointer hover:text-gray-400">&times;</span>
        <img id="lightbox-img" class="max-w-full max-h-[90vh] object-contain p-4" src="">
        <div id="lightbox-caption" class="absolute bottom-5 text-white text-xl tracking-wider"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
