<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yağmur'un Portfolyosu | ZartDesign</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans p-8">
    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">ZartDesign</h1>
            <p class="text-gray-500">Yağmur'un Dijital Sanat Portfolyosu</p>
        </header>

        <!-- Kategori Filtre Butonları -->
        <div id="filters" class="flex flex-wrap justify-center gap-3 mb-10">
            <!-- Butonlar JavaScript ile otomatik gelecek -->
        </div>

        <!-- Resimlerin geleceği alan -->
        <div id="gallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <!-- JavaScript burayı dolduracak -->
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
